# CI (spec 06): offline, deterministic, synthetic fixtures only (C-11).
# Network is used only to install dependencies; no dataset is downloaded.
name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  MLFLOW_DISABLE_AGENT_HINT: "1"
  PYTHONUTF8: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        run: python -m pip install --upgrade pip uv
      - name: Install package (CPU-only torch via tool.uv.sources)
        run: uv pip install --system -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Tests (synthetic fixture, fake RP_USER_KEY set inside tests)
        run: pytest

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t reviewpulse:ci .
      - name: OPS-T02 - container starts without a champion, /ready is 503
        run: |
          mkdir -p ci-state ci-releases
          docker run -d --name rp -p 8000:8000 \
            -e RP_USER_KEY=ci-only-fake-key-0123456789abcdef \
            -v "$PWD/ci-state:/app/state" -v "$PWD/ci-releases:/app/releases" \
            reviewpulse:ci
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          echo
          curl -fsS http://127.0.0.1:8000/health | grep -q '"alive"'
          code=$(curl -s -o ready.json -w '%{http_code}' http://127.0.0.1:8000/ready)
          cat ready.json; echo
          test "$code" = "503"
          grep -q '"NO_CHAMPION"' ready.json
      - name: Container logs
        if: always()
        run: docker logs rp || true
