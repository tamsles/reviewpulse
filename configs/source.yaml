# Decided by T01 data spike (reports/data-spike.md).
source:
  dataset: amazon_reviews_2023
  category: All_Beauty
  source_url: https://mcauleylab.ucsd.edu/public_datasets/data/amazon_2023/raw/review_categories/All_Beauty.jsonl.gz
  raw_path: data/raw/All_Beauty.jsonl.gz
  raw_field_mapping:
    user_id: user_id
    item_id: parent_asin
    timestamp: timestamp
    text: text
    rating: rating
  timestamp_unit: ms   # verified on real records in T01 (13-digit epoch ms)
  metadata_join_key: parent_asin
  positive_rating_threshold: 4.0
  weak_sentiment:
    negative_if_rating_at_most: 2.0
    positive_if_rating_at_least: 4.0
    neutral_rating_policy: ignore_for_sentiment
  license_review_status: pending
output:
  processed_dir: data/processed
