openapi: 3.0.3
info:
  title: ReviewPulse Recommendation API
  version: 1.2.0
  description: API contract. Ranking scores are not click or purchase probabilities.
servers:
  - url: http://127.0.0.1:8000
paths:
  /health:
    get:
      summary: Liveness
      responses:
        '200':
          description: Process is alive (a model may not be loaded yet)
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: {type: string, enum: [alive]}
  /ready:
    get:
      summary: Readiness of the release actually loaded by this process
      responses:
        '200':
          description: Model loaded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
        '503':
          description: No valid release loaded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/Readiness'}
  /v1/recommend:
    post:
      operationId: recommend
      summary: Personalized top-K recommendations
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/RecommendRequest'}
      responses:
        '200':
          description: Success (unknown users get the popularity fallback)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/RecommendResponse'}
        '422':
          description: Invalid argument (all argument errors, including malformed JSON, return 422; 400 is not used)
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '503':
          description: Model not ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
        '500':
          description: Unexpected error
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ApiError'}
components:
  schemas:
    Readiness:
      type: object
      required: [ready, loaded_release_id, reason]
      properties:
        ready: {type: boolean}
        loaded_release_id: {type: string, nullable: true}
        reason:
          type: string
          nullable: true
          enum: [NO_CHAMPION, BUNDLE_INVALID, USER_KEY_UNAVAILABLE, SMOKE_FAILED, LOADING, null]
          description: Null when ready=true. The service only loads the release the champion pointer refers to and never falls back to another release on failure.
    RecommendRequest:
      type: object
      additionalProperties: false
      required: [user_id, top_k]
      properties:
        user_id: {type: string, minLength: 1, maxLength: 128, pattern: '\S'}
        top_k: {type: integer, minimum: 1, maximum: 50}
    Recommendation:
      type: object
      required: [item_id, rank, score]
      properties:
        item_id: {type: string}
        rank: {type: integer, minimum: 1}
        score: {type: number, format: double}
    RecommendResponse:
      type: object
      required: [request_id, loaded_release_id, items, fallback_used, fusion_used, candidate_count, empty_reason]
      properties:
        request_id: {type: string, format: uuid}
        loaded_release_id: {type: string}
        items:
          type: array
          items: {$ref: '#/components/schemas/Recommendation'}
        fallback_used: {type: boolean}
        fusion_used: {type: boolean}
        candidate_count: {type: integer, minimum: 0}
        empty_reason:
          type: string
          nullable: true
          enum: [NO_CANDIDATES, null]
          description: Reason when items is empty; null otherwise
    ApiError:
      type: object
      required: [request_id, error]
      properties:
        request_id: {type: string, format: uuid}
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              enum: [INVALID_ARGUMENT, MODEL_NOT_READY, MODEL_UNAVAILABLE, INTERNAL_ERROR]
            message: {type: string}
