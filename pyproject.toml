[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "reviewpulse"
version = "0.1.0"
description = "Recommendation MLOps demo on Amazon Reviews'23 (single-machine portfolio project)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "pyyaml>=6.0",
    "torch>=2.3",
    "mlflow>=2.14",
]

[project.optional-dependencies]
dev = [
    "jsonschema>=4.22",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
reviewpulse = "reviewpulse.cli:main"

# CPU-only torch wheels (avoid multi-GB CUDA downloads)
[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.hatch.build.targets.wheel]
packages = ["src/reviewpulse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["docs"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
